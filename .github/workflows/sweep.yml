# Runs the dashboard's scheduled sweep every 30 minutes: marks appointments
# missed 3 hours after their start (and notifies the patient once), and
# prepares doctors' patient-reply notifications. Vercel's free plan can't
# schedule this often, so GitHub calls the protected route instead.
#
# Repo secrets needed (Settings > Secrets and variables > Actions):
#   DASHBOARD_URL  e.g. https://your-dashboard.vercel.app (no trailing /)
#   CRON_SECRET    the same value as CRON_SECRET on Vercel
#
# Scheduled runs only start from the default branch, may run a few minutes
# late, and GitHub pauses them after 60 days without repository activity.
name: Scheduled sweep

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (show what would change, write nothing)'
        type: boolean
        default: true

permissions: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the dashboard sweep
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: |
          if [ -z "$DASHBOARD_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set DASHBOARD_URL and CRON_SECRET in the repository secrets."
            exit 1
          fi
          code=$(curl -sS -o response.json -w '%{http_code}' --max-time 75 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$DASHBOARD_URL/api/cron/sweep?dry=$DRY")
          cat response.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::Sweep returned HTTP $code"
            exit 1
          fi
